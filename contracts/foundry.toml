[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[fuzz]
runs = 2_000

[invariant]
runs = 256
depth = 100
fail_on_revert = false

[fmt]
line_length = 120
number_underscore = "thousands"

[rpc_endpoints]
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"
robinhood = "https://rpc.mainnet.chain.robinhood.com"
